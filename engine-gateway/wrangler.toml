name = "aixodia-engine-gateway"
main = "src/index.js"
compatibility_date = "2026-11-07"

# The engine registry: id, name, url, origin_host. One table, written by each
# engine when it starts, read here for the console's engine switcher.
[[d1_databases]]
binding = "DB"
database_name = "aixodia"
database_id = "e8e746ea-691e-43bf-9fe2-c4e4016f29a1"

# This Worker is the whole hostname: it answers the registry and forwards every
# other request to the engine the path names, or to the first engine when it
# names none. The engines' own tunnel hosts are not public — each has an Access
# application that admits only this Worker's service token.
[[routes]]
pattern = "engine.aixodia.dpdns.org/*"
zone_name = "aixodia.dpdns.org"

# The hop that costs the most is this Worker to the engine's tunnel origin, not
# the client to this Worker: the origin is one machine, the clients are anywhere.
# Smart Placement puts the Worker next to whatever the requests keep talking to.
[placement]
mode = "smart"