name = "aixodia-engine-gateway"
main = "src/index.js"
compatibility_date = "2026-11-07"

# The engine registry: id, name, url, origin_host. One table, written by each
# engine when it starts, read here for the console's engine switcher.
[[d1_databases]]
binding = "DB"
database_name = "aixodia"
database_id = "e8e746ea-691e-43bf-9fe2-c4e4016f29a1"

# This Worker is the whole hostname: it answers the registry and forwards every
# other request to the engine the path names, or to the first engine when it
# names none. The engines' own tunnel hosts are not public — each has an Access
# application that admits only this Worker's service token.
[[routes]]
pattern = "engine.aixodia.dpdns.org/*"
zone_name = "aixodia.dpdns.org"

# What a machine writes about itself on first start: its tunnel token, its public
# address and its daemon URL. Deleting an engine removes these, so the next start
# of that machine provisions a fresh tunnel instead of dialling one that is gone.
[[kv_namespaces]]
binding = "CONFIG"
id = "b9159aba166f4f5c974250310f4459f7"

# The pages allowed to call this hostname from a browser. CORS is answered here
# because the origins behind Access refuse a request that carries an `Origin`.
#
# The account, zone and domain are what a machine's address is made of, and the
# one thing deletion needs to find that address by name. They are not secrets;
# the token that may act on them is, and lives in `wrangler secret put
# CF_ADMIN_TOKEN` (Tunnel:Edit, Zone.DNS:Edit, Workers KV Storage:Edit).
[vars]
CONSOLE_ORIGINS = "https://aixodia.dpdns.org,http://localhost:5173"
CF_ACCOUNT_ID = "3b953d1cbb784b3424c27798931bc37b"
CF_ZONE_ID = "0df5ea46806f151750ec01be67bf365b"
CF_DOMAIN = "aixodia.dpdns.org"

# The hop that costs the most is this Worker to the engine's tunnel origin, not
# the client to this Worker: the origin is one machine, the clients are anywhere.
# Smart Placement puts the Worker next to whatever the requests keep talking to.
[placement]
mode = "smart"