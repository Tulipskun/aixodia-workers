name = "aixodia-engine-gateway"
main = "src/index.js"
compatibility_date = "2026-11-07"

# The engine registry: id, name, url, origin_host. One table, read on every
# proxied request, written when an engine is added. The same rows answer
# `GET /engines` for the console's engine switcher.
[[d1_databases]]
binding = "DB"
database_name = "aixodia"
database_id = "e8e746ea-691e-43bf-9fe2-c4e4016f29a1"

[[routes]]
pattern = "engines.aixodia.dpdns.org/*"
zone_name = "aixodia.dpdns.org"
